name: Bootstrap Laravel API on feature branch

on:
  push:
    branches:
      - feat/laravel13-api-foundation
    paths:
      - '.github/workflows/laravel-bootstrap.yml'
      - 'scripts/bootstrap-laravel-api.sh'
      - 'scripts/configure-local-api-env.py'
      - 'scripts/laravel-template/**'

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout dedicated feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install PHP 8.4 with required extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, intl, pdo_pgsql, redis
          coverage: none
          tools: composer:v2
      - name: Verify PHP and Composer versions
        run: |
          php -v
          composer --version
      - name: Generate official Laravel application and lockfile
        run: bash scripts/bootstrap-laravel-api.sh
      - name: Validate PHP syntax
        run: |
          find services/api/app services/api/bootstrap services/api/routes services/api/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Start disposable PostgreSQL and Redis services
        run: |
          python3 scripts/dev-env.py init
          bash scripts/check-dev-infra.sh
      - name: Configure isolated Laravel environment
        run: python3 scripts/configure-local-api-env.py
      - name: Verify locked Composer dependencies
        working-directory: services/api
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress
          composer audit --no-interaction
      - name: Run database migrations and health tests
        working-directory: services/api
        run: |
          php artisan key:generate --force
          php artisan migrate --force
          php artisan route:list --except-vendor
          php artisan test
      - name: Verify existing editorial policy tests
        run: bash scripts/test-editorial-guard.sh
      - name: Commit reviewed scaffold to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api
          if git diff --cached --quiet; then
            echo "No Laravel files were generated." >&2
            exit 1
          fi
          git commit -m "feat(api): scaffold verified Laravel 13 runtime and dependency lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Stop disposable services without removing volumes
        if: always()
        run: |
          if [[ -f infrastructure/.env ]]; then
            docker compose --env-file infrastructure/.env -f infrastructure/compose.dev.yaml down || true
          fi
