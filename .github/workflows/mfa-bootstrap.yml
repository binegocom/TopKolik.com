name: Install verified MFA library (temporary)
on:
  push:
    branches:
      - feat/p03-006-staff-mfa-totp
    paths:
      - '.github/workflows/mfa-bootstrap.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, intl, pdo_pgsql, redis
          coverage: none
          tools: composer:v2
      - name: Install audited TOTP dependency
        working-directory: services/api
        run: |
          composer require 'pragmarx/google2fa:^9.1' --no-interaction --no-progress
          composer validate --strict
          composer audit --no-interaction
      - name: Commit exact Composer dependency lock to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/composer.json services/api/composer.lock
          test -n "$(git diff --cached --name-only)"
          git commit -m "build(mfa): lock maintained RFC 6238 library"
          git push origin "HEAD:${GITHUB_REF_NAME}"
