name: Install Sanctum on temporary auth branch

on:
  push:
    branches:
      - feat/reader-auth-sanctum
    paths:
      - '.github/workflows/bootstrap-sanctum.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout auth development branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Configure PHP runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, intl, pdo_pgsql, redis
          coverage: none
          tools: composer:v2
      - name: Install Sanctum and publish migration
        working-directory: services/api
        run: |
          composer require 'laravel/sanctum:^4.3' --no-interaction --no-progress
          php artisan vendor:publish --tag=sanctum-migrations
          composer validate --strict
          composer audit --no-interaction
      - name: Generate isolated credentials and database
        run: |
          python3 scripts/dev-env.py init
          bash scripts/check-dev-infra.sh
          python3 scripts/configure-local-api-env.py
      - name: Test against PostgreSQL and Redis
        working-directory: services/api
        run: |
          php artisan key:generate --force
          php artisan migrate --force
          php artisan test
      - name: Test existing publishing guard
        run: bash scripts/test-editorial-guard.sh
      - name: Commit verified dependency lock and migration to auth branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/composer.json services/api/composer.lock services/api/database/migrations
          if git diff --cached --quiet; then
            echo 'Nothing to commit: dependency installation was not applied.' >&2
            exit 1
          fi
          git commit -m 'build(auth): lock Sanctum 4 and personal access token schema'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Stop isolated containers
        if: always()
        run: |
          if [[ -f infrastructure/.env ]]; then
            docker compose --env-file infrastructure/.env -f infrastructure/compose.dev.yaml down || true
          fi
