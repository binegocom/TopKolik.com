name: topkolik-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in infrastructure/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infrastructure/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in infrastructure/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate REDIS_PASSWORD in infrastructure/.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - redisdata:/data
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: [tools]
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-58025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-51025}:1025"
    volumes:
      - maildata:/data
    networks: [backend]

  localstack:
    image: localstack/localstack:2026.10.4
    profiles: [aws]
    restart: unless-stopped
    environment:
      SERVICES: s3
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-54566}:4566"
    volumes:
      - localstackdata:/var/lib/localstack
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  maildata:
  localstackdata:

networks:
  backend:
    driver: bridge
